name: Fabric Auto-Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Azure Access Token
        id: auth
        run: |
          echo "🔐 Attempting to get Azure access token..."
          echo "Tenant ID: ${{ secrets.AZURE_TENANT_ID }}"
          echo "Client ID: ${{ secrets.AZURE_CLIENT_ID }}"
          
          TENANT="${{ secrets.AZURE_TENANT_ID }}"
          CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}"
          CLIENT_SECRET="${{ secrets.AZURE_CLIENT_SECRET }}"
          
          if [ -z "$TENANT" ] || [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "❌ ERROR: Missing required secrets (AZURE_TENANT_ID, AZURE_CLIENT_ID, or AZURE_CLIENT_SECRET)"
            exit 1
          fi
          
          echo "ℹ️  Sending request to: https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token"
          
          RESPONSE=$(curl -v -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=$CLIENT_ID" \
            -d "scope=https://api.fabric.microsoft.com/.default" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "grant_type=client_credentials" 2>&1)
          
          echo "📨 Azure Response:"
          echo "$RESPONSE"
          
          TOKEN=$(echo "$RESPONSE" | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)
          
          if [ -z "$TOKEN" ]; then
            echo "❌ Failed to obtain Azure access token"
            exit 1
          fi
          
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "✅ Successfully obtained Azure access token"

      - name: Trigger Fabric Deployment
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://api.fabric.microsoft.com/v1/deploymentPipelines/${{ secrets.FABRIC_PIPELINE_ID }}/deploy \
          -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
          -H "Content-Type: application/json" \
          -d '{
            "sourceStageId": "${{ secrets.FABRIC_SOURCE_STAGE_ID }}",
            "targetStageId": "${{ secrets.FABRIC_TARGET_STAGE_ID }}",
            "note": "Automated deployment from GitHub Actions"
          }')
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "📋 Deployment Response:"
          echo "$BODY"
          
          if [ "$HTTP_CODE" -ne 202 ]; then
            echo "❌ Deployment failed with HTTP $HTTP_CODE"
            exit 1
          fi
          
          echo "✅ Deployment triggered successfully (HTTP 202)"
